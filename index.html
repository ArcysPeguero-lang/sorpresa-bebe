<style>
:root{
  --cream:#fbf6f1;
  --paper:#fffdfb;
  --blush:#f3d9d5;
  --rose:#dca1a5;
  --rose-deep:#b56f78;
  --gold:#c49a45;
  --gold-l:#ead29a;
  --ink:#4b3a40;
  --muted:#8c787d;
  --sage:#bccab6;
  --shadow:0 18px 40px -18px rgba(120,70,80,.35);
  --serif:"Cormorant Garamond", Georgia, serif;
  --script:"Great Vibes", "Brush Script MT", cursive;
  --sans:"Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(120% 70% at 50% -10%, #f6dcd6 0%, rgba(246,220,214,0) 60%),
    radial-gradient(90% 60% at 100% 110%, #efe3d0 0%, rgba(239,227,208,0) 60%),
    var(--cream);
  background-attachment:fixed;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- fondo con corazones y estrellas flotando ---------- */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sky span{position:absolute;bottom:-40px;opacity:0;animation:floatUp linear infinite;will-change:transform}
@keyframes floatUp{
  0%{transform:translate(0,0) rotate(0);opacity:0}
  10%{opacity:.55}
  50%{transform:translate(18px,-55vh) rotate(25deg)}
  90%{opacity:.35}
  100%{transform:translate(-12px,-115vh) rotate(-10deg);opacity:0}
}

/* ---------- botón de música ---------- */
.music{
  position:fixed;top:max(14px, env(safe-area-inset-top));right:14px;z-index:20;
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(196,154,69,.45);
  background:rgba(255,253,251,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:var(--gold);font-size:20px;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 6px 18px -8px rgba(120,70,80,.35);transition:transform .2s;
}
.music:active{transform:scale(.92)}
.music.off{color:var(--muted);opacity:.7}
.music.off::after{content:"";position:absolute;width:24px;height:1.5px;background:currentColor;transform:rotate(-45deg)}

/* ---------- escenas ---------- */
main{position:relative;z-index:1}
.scene{
  min-height:100vh;min-height:100svh;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:72px 22px 56px;
  opacity:0;transition:opacity .9s ease;
}
.scene.is-shown{display:flex}
.scene.is-active{opacity:1}
.wrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center}

.reveal{opacity:0;transform:translateY(16px);filter:blur(5px);
  transition:opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.7,.2,1), filter 1.2s ease}
.reveal.in{opacity:1;transform:none;filter:none}

.eyebrow{font-family:var(--sans);font-weight:400;letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--rose-deep)}
.eyebrow b{font-weight:500}
.title{font-family:var(--serif);font-weight:500;font-size:clamp(30px,8vw,46px);line-height:1.12;margin:14px 0 6px;color:var(--ink)}
.title em{font-style:italic;color:var(--rose-deep)}
.lead{font-family:var(--serif);font-size:clamp(22px,5.6vw,30px);line-height:1.35;color:var(--ink);max-width:28ch}
.lead.soft{color:var(--muted);font-style:italic}
.script{font-family:var(--script);font-weight:400;color:var(--rose-deep);
  font-size:clamp(46px,13vw,78px);line-height:1.05;margin:26px 0 8px}
.name{font-family:var(--script);color:var(--rose-deep);font-size:clamp(50px,14vw,80px);line-height:1;margin-bottom:12px}
.hint{margin-top:16px;font-size:13px;color:var(--muted);letter-spacing:.04em}
.spacer{height:26px}

/* ---------- botones ---------- */
.btn{
  margin-top:34px;font-family:var(--sans);font-size:15px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:#fff;border:0;border-radius:999px;padding:17px 34px;cursor:pointer;
  background:linear-gradient(135deg,#d48d95 0%,#b56f78 100%);
  box-shadow:0 14px 30px -12px rgba(181,111,120,.75), inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .2s ease, box-shadow .2s ease;
  position:relative;overflow:hidden;
}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  transform:translateX(-120%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--rose-deep);border:1px solid var(--rose);box-shadow:none}
.btn.ghost::after{display:none}
.btn.small{font-size:13px;padding:14px 22px;margin-top:0}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}

/* ---------- caja de regalo ---------- */
.gift{position:relative;width:200px;height:200px;margin:34px auto 6px;cursor:pointer;animation:wobble 3.4s ease-in-out infinite}
.gift:focus-visible{outline:2px dashed var(--rose);outline-offset:10px;border-radius:12px}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}85%{transform:rotate(-3deg)}90%{transform:rotate(2deg)}}
.gift .shadow{position:absolute;left:50%;bottom:-14px;width:170px;height:18px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(120,70,80,.28),transparent);border-radius:50%}
.box{position:absolute;bottom:0;left:14px;width:172px;height:124px;border-radius:6px 6px 10px 10px;
  background:linear-gradient(160deg,#f7e3df 0%,#efcfca 55%,#e6bcb6 100%);
  box-shadow:var(--shadow), inset 0 -10px 18px rgba(181,111,120,.18)}
.box::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:28px;transform:translateX(-50%);
  background:linear-gradient(90deg,#b88a35,#ead29a 45%,#c49a45)}
.box::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 6px,transparent 6px 14px)}
.glow{position:absolute;left:50%;bottom:110px;width:40px;height:40px;transform:translate(-50%,0) scale(0);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,240,200,1),rgba(255,214,170,.6) 45%,rgba(255,214,170,0));opacity:0;pointer-events:none}
.lid{position:absolute;top:44px;left:4px;width:192px;height:40px;border-radius:7px;z-index:3;
  background:linear-gradient(170deg,#f9e9e6 0%,#efcdc8 100%);
  box-shadow:0 8px 14px -8px rgba(120,70,80,.45)}
.lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:30px;transform:translateX(-50%);
  background:linear-gradient(90deg,#b88a35,#ead29a 45%,#c49a45)}
.bow{position:absolute;left:50%;top:-2px;width:0;height:0}
.bow i{position:absolute;bottom:0;width:52px;height:36px;border:10px solid #d2ab5c;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.bow i:nth-child(1){right:-2px;transform:rotate(-24deg);transform-origin:right bottom}
.bow i:nth-child(2){left:-2px;transform:rotate(24deg);transform-origin:left bottom}
.bow b{position:absolute;left:-11px;bottom:-6px;width:22px;height:16px;border-radius:7px;background:linear-gradient(#ead29a,#c49a45)}

.gift.shake{animation:shake .6s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg) scale(1.03)}40%{transform:rotate(6deg) scale(1.05)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.gift.open{animation:none}
.gift.open .lid{animation:lidOff 1.1s cubic-bezier(.3,.6,.25,1) forwards}
@keyframes lidOff{0%{transform:none}25%{transform:translateY(6px)}100%{transform:translate(70px,-300px) rotate(38deg);opacity:0}}
.gift.open .glow{animation:glow 1.6s ease-out forwards}
@keyframes glow{0%{transform:translate(-50%,0) scale(0);opacity:0}30%{opacity:1}100%{transform:translate(-50%,0) scale(9);opacity:0}}

/* ---------- latido ---------- */
.beat{font-size:40px;color:var(--rose);margin-top:8px;animation:beat 1.4s ease-in-out infinite;display:inline-block}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.14)}}

/* ---------- revelación del rol ---------- */
.role{font-family:var(--serif);font-weight:500;font-size:clamp(30px,8vw,44px);line-height:1.15;margin-top:30px;color:var(--ink)}
.role .gold{display:block;font-family:var(--serif);font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  font-size:clamp(64px,20vw,118px);line-height:1;margin:6px 0 2px;
  background:linear-gradient(100deg,#b88a35 0%,#ead29a 30%,#c49a45 50%,#f3e2b5 70%,#b88a35 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
.role.plain{font-style:italic;font-size:clamp(28px,7vw,40px);max-width:20ch}
@keyframes shimmer{to{background-position:-220% 0}}

/* ---------- foto ---------- */
.polaroid{background:#fff;padding:14px 14px 18px;border-radius:4px;transform:rotate(-2.5deg);
  box-shadow:0 26px 50px -22px rgba(90,50,60,.5), 0 2px 6px rgba(90,50,60,.08);width:min(100%,360px)}
.polaroid .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:#111;border-radius:2px}
.polaroid img,.polaroid svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.polaroid figcaption{font-family:var(--script);color:var(--rose-deep);font-size:34px;margin-top:10px;line-height:1}
.tape{position:absolute;top:-12px;left:50%;width:90px;height:26px;transform:translateX(-50%) rotate(3deg);
  background:rgba(234,210,154,.55);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.polaroid-wrap{position:relative}

.shoes{width:min(70%,230px);margin:30px auto 4px;display:block}
.final{font-family:var(--serif);font-style:italic;font-size:clamp(21px,5.2vw,26px);line-height:1.45;color:var(--ink);max-width:30ch;margin-top:14px}
.due{margin-top:26px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.due strong{display:block;margin-top:6px;font-family:var(--serif);font-size:26px;letter-spacing:.04em;text-transform:none;font-weight:500;color:var(--rose-deep)}
.sign{margin-top:26px;font-family:var(--script);font-size:38px;color:var(--ink);line-height:1.1}
.sign small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

.divider{display:flex;align-items:center;gap:12px;color:var(--gold);margin:22px 0 4px;font-size:14px}
.divider::before,.divider::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-l))}
.divider::after{transform:scaleX(-1)}

/* ---------- partículas ---------- */
.particle{position:fixed;left:0;top:0;pointer-events:none;z-index:30;line-height:1;will-change:transform,opacity;user-select:none}

@media (prefers-reduced-motion: reduce){
  .gift,.btn::after,.role .gold,.beat{animation:none}
  .reveal{transition-duration:.4s;filter:none}
}
@media (min-width:700px){
  .gift{width:230px;height:230px}
  .box{left:16px;width:198px;height:142px}
  .lid{top:50px;width:222px;left:4px;height:44px}
  .glow{bottom:126px}
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true"></div>
<button class="music off" id="musicBtn" type="button" aria-label="Activar música">♪</button>

<main>
  <!-- 1. INTRO -->
  <section class="scene is-shown is-active" id="intro">
    <div class="wrap">
      <p class="eyebrow">Para <b id="introName">ti</b></p>
      <h1 class="title">Tenemos algo<br><em>muy especial</em><br>que contarte…</h1>
      <div class="gift" id="gift" role="button" tabindex="0" aria-label="Abrir mi regalo">
        <div class="shadow"></div>
        <div class="glow"></div>
        <div class="box"></div>
        <div class="lid"><div class="bow"><i></i><i></i><b></b></div></div>
      </div>
      <button class="btn" id="openBtn" type="button">Abrir mi regalo</button>
      <p class="hint">Sube el volumen 🔊</p>
    </div>
  </section>

  <!-- 2. LA NOTICIA -->
  <section class="scene" id="s1">
    <div class="wrap">
      <p class="lead reveal" data-d="400">Hay noticias que cambian la vida<br>y alegran el corazón.</p>
      <h2 class="script reveal" data-d="2400" data-burst="soft">¡Estamos esperando un bebé!</h2>
      <span class="beat reveal" data-d="3600" aria-hidden="true">♥</span>
      <button class="btn ghost reveal" data-d="4600" data-next="s2" type="button">Hay algo más…</button>
    </div>
  </section>

  <!-- 3. PARA TI -->
  <section class="scene" id="s2">
    <div class="wrap">
      <p class="name reveal" data-d="300" id="nameLine"></p>
      <p class="lead reveal" data-d="1300" id="msg"></p>
      <div class="spacer"></div>
      <p class="lead soft reveal" data-d="3400" id="placeLine">Y tú tienes un lugar muy especial en esta historia…</p>
      <h2 class="role reveal" data-d="5600" data-burst="big" id="role"></h2>
      <button class="btn reveal" data-d="7200" data-next="s3" type="button">Ver su primera foto</button>
    </div>
  </section>

  <!-- 4. LA FOTO -->
  <section class="scene" id="s3">
    <div class="wrap">
      <div class="polaroid-wrap reveal" data-d="300">
        <figure class="polaroid">
          <div class="ph">
            <img id="eco" alt="Ecografía de nuestro bebé">
            <svg id="ecoPlaceholder" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:none">
              <defs>
                <radialGradient id="us" cx="50%" cy="4%" r="96%">
                  <stop offset="0" stop-color="#8d8d8d"/><stop offset=".55" stop-color="#3b3b3b"/><stop offset="1" stop-color="#151515"/>
                </radialGradient>
              </defs>
              <rect width="400" height="300" fill="#0c0c0e"/>
              <path d="M200 18 L352 262 A287 287 0 0 1 48 262 Z" fill="url(#us)"/>
              <ellipse cx="206" cy="168" rx="62" ry="42" fill="#d8d8d8" opacity=".22"/>
              <circle cx="178" cy="150" r="22" fill="#e6e6e6" opacity=".28"/>
              <text x="200" y="288" text-anchor="middle" fill="#cfcfcf" font-family="Jost, sans-serif" font-size="13" letter-spacing="2">AQUÍ VA LA ECOGRAFÍA</text>
            </svg>
          </div>
          <figcaption>Nuestra primera foto</figcaption>
        </figure>
        <span class="tape" aria-hidden="true"></span>
      </div>

      <svg class="shoes reveal" data-d="1500" viewBox="0 0 240 132" aria-hidden="true">
        <defs>
          <linearGradient id="shoeFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6e2de"/>
          </linearGradient>
          <g id="shoe">
            <path d="M14 22 H58 C60 22 61 24 61 26 L62 62 C92 64 112 74 112 92 C112 106 100 110 80 110 H18 C12 110 10 106 10 100 V26 C10 24 12 22 14 22 Z"
                  fill="url(#shoeFill)" stroke="#dca1a5" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M10 101 C10 107 13 110 18 110 H80 C100 110 112 106 112 96" fill="none" stroke="#c49a45" stroke-width="2.5" stroke-linecap="round"/>
            <rect x="6" y="14" width="60" height="14" rx="7" fill="#f3d9d5" stroke="#dca1a5" stroke-width="2.5"/>
            <path d="M12 60 Q38 70 64 58" fill="none" stroke="#dca1a5" stroke-width="6" stroke-linecap="round"/>
            <circle cx="56" cy="61" r="4.2" fill="#c49a45"/>
            <path d="M88 84 c-3 -4 -9 -2 -8 2 c1 3 8 7 8 7 s7 -4 8 -7 c1 -4 -5 -6 -8 -2 z" fill="#dca1a5"/>
          </g>
        </defs>
        <use href="#shoe" transform="translate(4 12) rotate(-4 60 60)"/>
        <use href="#shoe" transform="translate(236 12) scale(-1 1) rotate(-4 60 60)"/>
      </svg>

      <p class="final reveal" data-d="2600" id="finalLine"></p>
      <div class="divider reveal" data-d="3300" aria-hidden="true">♥</div>
      <p class="due reveal" data-d="3700" id="due">Llegada prevista<strong id="dueDate"></strong></p>
      <p class="sign reveal" data-d="4500"><small>Con todo nuestro amor</small><span id="signName"></span></p>

      <div class="actions reveal" data-d="5400">
        <a class="btn small" id="replyBtn" target="_blank" rel="noopener" style="display:none">Responder a los papás</a>
        <button class="btn ghost small" id="replayBtn" type="button">Volver a verlo</button>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  /* ---------- datos de la persona ---------- */
  const ROLES = { tio:"tío", tia:"tía", abuelo:"abuelo", abuela:"abuela", padrino:"padrino", madrina:"madrina", primo:"primo", prima:"prima", ninguno:null };
  const DEFAULT_MSG = {
    tio:"Prepárate, porque alguien muy pequeñito está por llegar a tu vida… y ya tiene un lugar reservado en tu corazón.",
    abuelo:"La familia está a punto de crecer, y con ella todo el amor que tú nos has enseñado a dar.",
    padrino:"Queremos que esta personita crezca rodeada de gente buena, y tú eres de las mejores que conocemos.",
    primo:"Muy pronto vas a tener un nuevo compañero de aventuras.",
    ninguno:"No podíamos guardar esta felicidad sin compartirla contigo."
  };
  DEFAULT_MSG.tia = DEFAULT_MSG.tio; DEFAULT_MSG.abuela = DEFAULT_MSG.abuelo;
  DEFAULT_MSG.madrina = DEFAULT_MSG.padrino; DEFAULT_MSG.prima = DEFAULT_MSG.primo;

  const norm = s => (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const params = new URLSearchParams(location.search);
  let p = null;
  const key = norm(params.get("p"));
  if (key && CONFIG.personas && CONFIG.personas[key]) p = { ...CONFIG.personas[key] };
  else if (params.get("n") || params.get("r") || params.get("m"))
    p = { nombre: params.get("n") || "", rol: params.get("r") || "", mensaje: params.get("m") || "" };

  const nombre = (p && p.nombre || "").trim().slice(0, 40);
  const rol = p && (norm(p.rol) in ROLES) ? norm(p.rol) : "ninguno";
  let mensaje = (p && p.mensaje || "").trim().slice(0, 400);
  // Si el mensaje empieza con el nombre ("Carlos, ..."), lo quitamos porque ya aparece arriba
  if (nombre && norm(mensaje).startsWith(norm(nombre) + ",")) {
    mensaje = mensaje.slice(nombre.length + 1).trim();
    mensaje = mensaje.charAt(0).toUpperCase() + mensaje.slice(1);
  }
  if (!mensaje) mensaje = DEFAULT_MSG[rol];

  const $ = id => document.getElementById(id);
  if (nombre) { $("introName").textContent = nombre; document.title = `${nombre}, tenemos una sorpresa para ti 🎁`; }
  if (nombre) $("nameLine").textContent = nombre + ","; else $("nameLine").remove();
  $("msg").textContent = mensaje;

  const roleEl = $("role");
  if (ROLES[rol]) {
    roleEl.append("¡Vas a ser");
    const g = document.createElement("span"); g.className = "gold"; g.textContent = ROLES[rol] + "!";
    roleEl.append(g);
  } else {
    $("placeLine").textContent = "Y tú tienes un lugar muy especial en nuestra historia…";
    roleEl.classList.add("plain");
    roleEl.textContent = "Por eso queríamos que fueras de los primeros en saberlo ❤️";
  }

  $("finalLine").textContent = CONFIG.fraseFinal;
  $("signName").textContent = CONFIG.papas;
  if (CONFIG.llegada) $("dueDate").textContent = CONFIG.llegada; else $("due").remove();

  const eco = $("eco");
  eco.onerror = () => { eco.style.display = "none"; $("ecoPlaceholder").style.display = "block"; };
  eco.src = CONFIG.ecografia;

  if (CONFIG.whatsapp) {
    const txt = `¡${nombre ? "Soy " + nombre + "… " : ""}Acabo de abrir la sorpresa! 🥹❤️ ¡Felicidades!`;
    const a = $("replyBtn");
    a.href = `https://wa.me/${CONFIG.whatsapp.replace(/\D/g, "")}?text=${encodeURIComponent(txt)}`;
    a.style.display = "";
  }

  /* ---------- fondo flotante ---------- */
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const sky = document.querySelector(".sky");
  const skyColors = ["#dca1a5", "#e8c0bf", "#c49a45", "#ead29a", "#bccab6"];
  for (let i = 0; i < (reduce ? 8 : 22); i++) {
    const s = document.createElement("span");
    s.textContent = pick(["♥", "✦", "♡", "✧", "♥"]);
    s.style.left = rand(0, 100) + "%";
    s.style.fontSize = rand(10, 22) + "px";
    s.style.color = pick(skyColors);
    s.style.animationDuration = rand(16, 32) + "s";
    s.style.animationDelay = -rand(0, 32) + "s";
    sky.appendChild(s);
  }

  /* ---------- partículas ---------- */
  const BURST_CHARS = ["♥", "♥", "♥", "✦", "✧", "★", "🍼", "🧸", "👶", "🎀", "⭐", "💕"];
  const BURST_COLORS = ["#dca1a5", "#b56f78", "#c49a45", "#ead29a", "#e8a8b0", "#bccab6"];
  function burst(x, y, count = 60, spread = 1.15, power = 1) {
    if (reduce) count = Math.round(count / 4);
    for (let i = 0; i < count; i++) {
      const el = document.createElement("span");
      el.className = "particle";
      el.textContent = pick(BURST_CHARS);
      el.style.color = pick(BURST_COLORS);
      el.style.fontSize = rand(14, 30) + "px";
      document.body.appendChild(el);
      const ang = -Math.PI / 2 + rand(-spread, spread);
      const sp = rand(140, 380) * power;
      const dx = Math.cos(ang) * sp, dy = Math.sin(ang) * sp;
      const rot = rand(-260, 260);
      const dur = rand(1800, 3000);
      const anim = el.animate([
        { transform: `translate(${x}px,${y}px) translate(-50%,-50%) scale(.3) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${x + dx * .7}px,${y + dy * .7}px) translate(-50%,-50%) scale(1) rotate(${rot * .6}deg)`, opacity: 1, offset: .45 },
        { transform: `translate(${x + dx}px,${y + dy + rand(180, 320)}px) translate(-50%,-50%) scale(.85) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: dur, easing: "cubic-bezier(.12,.72,.3,1)", fill: "forwards" });
      anim.onfinish = () => el.remove();
    }
  }
  const centerOf = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

  /* ---------- música (caja de música, compuesta aquí, sin archivos) ---------- */
  const SONG = [
    [48,[76,79,84]],[43,[83,79,76]],[41,[77,81,86]],[41,[84,81,77]],
    [48,[76,79,84]],[43,[86,84,83]],[45,[84,79,76]],[48,[[72,3]]],
    [41,[81,84,88]],[41,[86,84,81]],[48,[79,84,88]],[48,[86,84,79]],
    [38,[77,81,84]],[43,[83,81,79]],[48,[76,79,84]],[36,[[84,3]]]
  ];
  const Music = {
    ctx: null, on: false, timer: null, t: 0, bar: 0,
    init() {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.16;
      const delay = this.ctx.createDelay(); delay.delayTime.value = 0.32;
      const fb = this.ctx.createGain(); fb.gain.value = 0.28;
      const wet = this.ctx.createGain(); wet.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
      this.master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(this.ctx.destination);
      return true;
    },
    note(midi, at, len, vol, type = "sine") {
      const f = 440 * Math.pow(2, (midi - 69) / 12);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(vol, at + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0008, at + len);
      g.connect(this.master);
      const o1 = this.ctx.createOscillator(); o1.type = type; o1.frequency.value = f; o1.connect(g);
      const g2 = this.ctx.createGain(); g2.gain.value = 0.22; g2.connect(g);
      const o2 = this.ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 3; o2.connect(g2);
      o1.start(at); o2.start(at); o1.stop(at + len + .05); o2.stop(at + len + .05);
    },
    schedule() {
      const beat = 0.46;
      while (this.t < this.ctx.currentTime + 0.8) {
        const [bass, notes] = SONG[this.bar];
        this.note(bass, this.t, beat * 3.2, 0.35, "triangle");
        let tt = this.t;
        notes.forEach(n => { const [m, b] = Array.isArray(n) ? n : [n, 1]; this.note(m, tt, Math.max(1.6, b * beat * 1.4), 0.5); tt += b * beat; });
        this.t += beat * 3; this.bar = (this.bar + 1) % SONG.length;
      }
      this.timer = setTimeout(() => this.schedule(), 150);
    },
    start() {
      if (!this.ctx && !this.init()) return;
      this.ctx.resume(); this.on = true; this.t = this.ctx.currentTime + 0.15;
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setValueAtTime(0.0001, this.ctx.currentTime);
      this.master.gain.exponentialRampToValueAtTime(0.16, this.ctx.currentTime + 1.5);
      clearTimeout(this.timer); this.schedule();
      musicBtn.classList.remove("off"); musicBtn.setAttribute("aria-label", "Silenciar música");
    },
    stop() {
      this.on = false; clearTimeout(this.timer);
      if (this.ctx) { this.master.gain.cancelScheduledValues(this.ctx.currentTime); this.master.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.2); }
      musicBtn.classList.add("off"); musicBtn.setAttribute("aria-label", "Activar música");
    }
  };
  const musicBtn = $("musicBtn");
  musicBtn.addEventListener("click", () => Music.on ? Music.stop() : Music.start());

  /* ---------- escenas ---------- */
  let current = $("intro"), timers = [];
  function revealAll(scene) {
    timers.forEach(clearTimeout); timers = [];
    scene.querySelectorAll(".reveal:not(.in)").forEach(el => showEl(el));
  }
  function showEl(el) {
    el.classList.add("in");
    if (el.dataset.burst) {
      setTimeout(() => {
        const [x, y] = centerOf(el);
        if (el.dataset.burst === "big") {
          burst(x, y, 70, 1.3, 1.15);
          setTimeout(() => { burst(window.innerWidth * .12, window.innerHeight * .85, 26, .5, 1.3); burst(window.innerWidth * .88, window.innerHeight * .85, 26, .5, 1.3); }, 350);
          if (navigator.vibrate) navigator.vibrate([60, 60, 120]);
        } else burst(x, y, 34, 1.1, .8);
      }, 350);
    }
  }
  function go(id) {
    const next = $(id); if (!next || next === current) return;
    timers.forEach(clearTimeout); timers = [];
    const prev = current; current = next;
    prev.classList.remove("is-active");
    setTimeout(() => {
      prev.classList.remove("is-shown");
      next.querySelectorAll(".reveal").forEach(el => el.classList.remove("in"));
      next.classList.add("is-shown");
      window.scrollTo(0, 0);
      void next.offsetWidth;
      next.classList.add("is-active");
      next.querySelectorAll(".reveal").forEach(el => {
        timers.push(setTimeout(() => showEl(el), +(el.dataset.d || 0) * (reduce ? .5 : 1)));
      });
    }, 800);
  }
  // Tocar la pantalla adelanta los textos que faltan por aparecer
  document.querySelectorAll(".scene:not(#intro)").forEach(sc =>
    sc.addEventListener("click", e => { if (!e.target.closest("button,a")) revealAll(sc); }));
  document.querySelectorAll("[data-next]").forEach(b => b.addEventListener("click", () => go(b.dataset.next)));

  /* ---------- abrir el regalo ---------- */
  const gift = $("gift");
  let opening = false;
  function openGift() {
    if (opening) return; opening = true;
    if (CONFIG.musica) Music.start();
    gift.classList.add("shake");
    setTimeout(() => {
      gift.classList.remove("shake"); gift.classList.add("open");
      const r = gift.querySelector(".box").getBoundingClientRect();
      setTimeout(() => burst(r.left + r.width / 2, r.top + 10, 80, 1.2, 1.1), 250);
      setTimeout(() => go("s1"), 1700);
    }, 620);
  }
  gift.addEventListener("click", openGift);
  gift.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openGift(); } });
  $("openBtn").addEventListener("click", openGift);

  $("replayBtn").addEventListener("click", () => {
    gift.classList.remove("open"); opening = false;
    go("intro");
  });
})();
</script>
</body>
</html>
